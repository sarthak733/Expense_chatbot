syntax = "proto3";

package expense.v1;

option go_package = "expense-server/gen/expense/v1;expensev1";

message User {
  int32  id         = 1;
  string username   = 2;
  string created_at = 3;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
}

message RegisterResponse {
  string message = 1;
  User   user    = 2;
  string token   = 3; // Returns the JWT token
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string message = 1;
  User   user    = 2;
  string token   = 3; // Returns the JWT token
}

message LogoutRequest {}

message LogoutResponse {
  string message = 1;
}

service AuthService {
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc Login    (LoginRequest)    returns (LoginResponse);
  // Logout will require the JWT token to be passed in the Authorization header.
  rpc Logout   (LogoutRequest)   returns (LogoutResponse);
}
