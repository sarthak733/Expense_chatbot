services:
  # ── 1. Go Backend Web Service ────────────────────────────────────────────────
  - type: web
    name: expense-tracker-backend
    runtime: go
    rootDir: expense-server
    buildCommand: go build -o server ./cmd/server
    startCommand: ./server
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # Set this to your frontend URL after first deploy
      - key: TZ
        value: Asia/Kolkata

  # ── 2. Svelte/Vite Frontend Static Site ─────────────────────────────────────
  - type: web
    name: expense-tracker-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: Frontend
    envVars:
      - key: VITE_API_URL
        sync: false   # Set this to your backend URL after first deploy

databases:
  # ── 3. Managed PostgreSQL Database ──────────────────────────────────────────
  - name: expense-tracker-db
    plan: free
